name: Testes

# Roda a suíte inteira em todo push (qualquer branch) e em todo pull request.
# Sem secrets: os testes usam o armazenamento local e um cliente OCI falso.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      MEDIFLOW_ARMAZENAMENTO: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest -v
