# ============================================================================
# MediFlow - Configuração Nginx Reverse Proxy & Hardening de Rede
# Hackathon ONE G10 - Grupo 10: MediFlow
# Responsável: Ingrid Soares (Infra OCI, Redes, Segurança & Deploy)
# ============================================================================

limit_req_zone $binary_remote_addr zone=mediflow_api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Limite de tamanho para upload de laudos PDF/Imagens (15 MB)
    client_max_body_size 15M;

    # Cabeçalhos de Segurança HTTP (OWASP Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy Reverso para a API FastAPI (/api/v1/...)
    location /api/ {
        limit_req zone=mediflow_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy Reverso para Interface Streamlit (/) com suporte a WebSocket
    location / {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
